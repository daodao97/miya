{
  "name": "Miya",
  "id": "com.daodao.miya",
  "version": "0.1.3",
  "build_number": 1,
  "icon": {
    "png": "resources/ios/app-icon.png"
  },
  "apple": {
    "app_group": "group.com.daodao.miya",
    "info": {
      "CFBundleDisplayName": "Miya",
      "NSLocalNetworkUsageDescription": "Connect to Miya on your desktop over the same Wi-Fi using an encrypted local connection for lower latency.",
      "CFBundleDevelopmentRegion": "en",
      "CFBundleLocalizations": [
        "en",
        "zh-Hans"
      ],
      "LSMinimumSystemVersion": "13.0",
      "NSSupportsAutomaticGraphicsSwitching": true,
      "NSAppleEventsUsageDescription": "Control terminal applications to start and manage your coding sessions.",
      "NSAccessibilityUsageDescription": "Control keyboard and pointer input when you use remote desktop.",
      "NSScreenCaptureUsageDescription": "Share your Mac screen with your paired devices when you use remote desktop.",
      "NSMicrophoneUsageDescription": "Record your voice while you hold the input to convert it to text using cloud recognition.",
      "NSFaceIDUsageDescription": "Verify your identity to save or use your Mac login password to unlock remote desktop.",
      "NSCameraUsageDescription": "Scan the QR code in Miya on your desktop to view conversations.",
      "NSAppTransportSecurity": {
        "NSAllowsLocalNetworking": true
      }
    }
  },
  "live_activities": {
    "enabled": true,
    "frequent_updates": false
  },
  "android": {
    "target_sdk": 36,
    "permissions": [
      "POST_NOTIFICATIONS",
      "FOREGROUND_SERVICE",
      "CAMERA",
      "RECORD_AUDIO",
      "USE_BIOMETRIC",
      "ACCESS_COARSE_LOCATION",
      "ACCESS_FINE_LOCATION",
      "READ_MEDIA_VISUAL_USER_SELECTED"
    ],
    "data_sync": true,
    "recording": true,
    "loopback_cleartext": true
  },
  "sign": {},
  "build": {
    "output": "build",
    "installers": false,
    "jobs": 1,
    "open": false
  },
  "updates": {
    "channel": "none"
  },
  "url_schemes": [
    "miya"
  ]
}
