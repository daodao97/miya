name: Package

# Packages Miya for macOS (DMG), iOS and Android with the MyGo toolchain.
# go.mod pins the daodao97/mygo fork (replace github.com/egoist/mygo => a
# pseudo-version), so the jobs need only this repository; a local go.work
# that points at ../mygo is for development and is not committed.
#
# Signing is optional. Without secrets the jobs still produce artifacts:
#   macOS   ad hoc signed DMG (Gatekeeper blocks it on other Macs)
#   iOS     unsigned device build (compile check; not installable)
#   Android debug-signed APK
#
# Secrets (all optional):
#   MACOS_CERTIFICATE_BASE64, MACOS_CERTIFICATE_PASSWORD   Developer ID Application .p12
#   APPLE_ID, APPLE_APP_PASSWORD, APPLE_TEAM_ID            notarization (needs the certificate)
#   IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD       Apple Distribution .p12
#   IOS_PROFILE_BASE64                                     provisioning profile for com.daodao.miya

on:
  workflow_dispatch:
    inputs:
      ios_export_method:
        description: IPA export method when iOS signing secrets are set
        type: choice
        options: [app-store-connect, release-testing, debugging, enterprise]
        default: app-store-connect
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md', 'docs/**']

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: 28.2.13676358
  CGO_ENABLED: '0'

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Set the version from the tag
        if: github.ref_type == 'tag'
        run: python3 scripts/ci-config.py --version "$GITHUB_REF_NAME"
      - name: Import the Developer ID identity
        if: env.MACOS_CERTIFICATE_BASE64 != ''
        run: |
          umask 077
          dir="$RUNNER_TEMP/macos-signing"; mkdir -p "$dir"
          kc="$dir/signing.keychain-db"; pw=$(openssl rand -hex 32)
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$dir/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 7200 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security import "$dir/cert.p12" -k "$kc" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" > /dev/null
          rm -f "$dir/cert.p12"
          identity=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)
          if [ -z "$identity" ]; then echo 'No Developer ID Application identity in the certificate' >&2; exit 1; fi
          echo "MIYA_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            xcrun notarytool store-credentials miya-notary --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --keychain "$kc"
            python3 scripts/ci-config.py --notarize miya-notary "$kc"
          fi
      - name: Build the app and disk image
        run: |
          out="$RUNNER_TEMP/dist"
          sign=()
          if [ -n "${MIYA_SIGNING_IDENTITY:-}" ]; then sign=(-sign "$MIYA_SIGNING_IDENTITY"); fi
          go tool mygo build -platform darwin/universal "${sign[@]}" -o "$out"
          dmg=$(find "$out" -name '*.dmg' -print -quit)
          if [ -z "$dmg" ]; then echo 'mygo build produced no disk image' >&2; exit 1; fi
          codesign --verify --deep --strict "$(find "$out" -maxdepth 2 -name '*.app' -print -quit)"
          shasum -a 256 "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: miya-macos
          path: ${{ env.DMG }}
          if-no-files-found: error
          retention-days: 30
      - name: Remove the signing keychain
        if: always() && env.MACOS_KEYCHAIN != ''
        run: |
          security delete-keychain "$MACOS_KEYCHAIN" || true
          rm -rf "$RUNNER_TEMP/macos-signing"

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      IOS_EXPORT_METHOD: ${{ inputs.ios_export_method || 'app-store-connect' }}
      IOS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Set the version from the tag
        if: github.ref_type == 'tag'
        run: python3 scripts/ci-config.py --version "$GITHUB_REF_NAME"
      - name: Check the iOS tools
        run: go tool mygo ios doctor
      - name: Import the distribution identity and profile
        if: env.IOS_CERTIFICATE_BASE64 != '' && env.IOS_PROFILE_BASE64 != ''
        run: |
          umask 077
          dir="$RUNNER_TEMP/ios-signing"; mkdir -p "$dir"
          kc="$dir/signing.keychain-db"; pw=$(openssl rand -hex 32)
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$dir/cert.p12"
          printf '%s' "$IOS_PROFILE_BASE64" | base64 --decode > "$dir/profile.mobileprovision"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 7200 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security import "$dir/cert.p12" -k "$kc" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" > /dev/null
          rm -f "$dir/cert.p12"
          security cms -D -i "$dir/profile.mobileprovision" > "$dir/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$dir/profile.plist")
          team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$dir/profile.plist")
          appid=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$dir/profile.plist")
          case "$appid" in *.com.daodao.miya) ;; *) echo "Profile is for $appid, not com.daodao.miya" >&2; exit 1 ;; esac
          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles"
          cp "$dir/profile.mobileprovision" "$profiles/$uuid.mobileprovision"
          python3 scripts/ci-config.py --ios-signing "$team" "$uuid"
          echo "IOS_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_PATH=$profiles/$uuid.mobileprovision" >> "$GITHUB_ENV"
          echo "IOS_SIGNED=1" >> "$GITHUB_ENV"
      - name: Build the signed archive and IPA
        if: env.IOS_SIGNED == '1'
        run: |
          out="$RUNNER_TEMP/ios"
          ./scripts/build-ios.sh -ios-archive -ios-export-method "$IOS_EXPORT_METHOD" -ios-build-number "$IOS_BUILD_NUMBER" -o "$out"
          ipa=$(find "$out" -path '*/Export/*.ipa' -print -quit)
          symbols=$(find "$out" -maxdepth 4 -path '*.xcarchive/dSYMs/*.dSYM' -print -quit)
          if [ -z "$ipa" ]; then echo 'mygo build produced no IPA' >&2; exit 1; fi
          check=(go tool mygo ios check -ipa "$ipa" -json)
          if [ -n "$symbols" ]; then check+=(-symbols "$symbols"); fi
          if [ "$IOS_EXPORT_METHOD" = app-store-connect ]; then check+=(-distribution); fi
          "${check[@]}"
          mkdir -p "$RUNNER_TEMP/ios-artifact"
          cp "$ipa" "$RUNNER_TEMP/ios-artifact/"
          if [ -n "$symbols" ]; then ditto -c -k --keepParent "$symbols" "$RUNNER_TEMP/ios-artifact/Miya.dSYM.zip"; fi
      - name: Build an unsigned device app
        if: env.IOS_SIGNED != '1'
        run: |
          python3 scripts/ci-config.py --unsigned-ios
          out="$RUNNER_TEMP/ios"
          ./scripts/build-ios.sh -ios-build-number "$IOS_BUILD_NUMBER" -o "$out"
          app=$(find "$out" -maxdepth 3 -name '*.app' -print -quit)
          if [ -z "$app" ]; then echo 'mygo build produced no app' >&2; exit 1; fi
          mkdir -p "$RUNNER_TEMP/ios-artifact"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/ios-artifact/Miya-ios-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: miya-ios
          path: ${{ runner.temp }}/ios-artifact/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove the signing material
        if: always() && env.IOS_KEYCHAIN != ''
        run: |
          security delete-keychain "$IOS_KEYCHAIN" || true
          rm -f "$IOS_PROFILE_PATH"
          rm -rf "$RUNNER_TEMP/ios-signing"

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set the version from the tag
        if: github.ref_type == 'tag'
        run: python3 scripts/ci-config.py --version "$GITHUB_REF_NAME"
      - name: Install the NDK
        run: |
          # yes dies of SIGPIPE once sdkmanager stops reading; pipefail would fail the step.
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null
      # The same prebuilt HarfBuzz/FreeType that MyGo's Android workflow uses.
      - name: Download HarfBuzz and FreeType for Android
        run: |
          mkdir -p "$RUNNER_TEMP/hb"
          curl -fsSL https://github.com/Heyana/mygo-upstream/releases/download/hb-android-arm64/hb-android-arm64.tar.gz \
            | tar xz -C "$RUNNER_TEMP/hb"
          echo "MYGO_HB_ANDROID=$RUNNER_TEMP/hb/android" >> "$GITHUB_ENV"
      - name: Build the APK
        env:
          CGO_ENABLED: '1'
        run: |
          ./scripts/build-android.sh
          sha256sum build/android-arm64/Miya.apk
      - uses: actions/upload-artifact@v4
        with:
          name: miya-android
          path: build/android-arm64/Miya.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: [macos, ios, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create a draft release with the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "Miya $GITHUB_REF_NAME"
