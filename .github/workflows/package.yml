name: Package

# Resolve the pinned NSGo release from go.mod on each runner.
# Optional signing secrets: MACOS_CERTIFICATE_BASE64/PASSWORD, APPLE_ID,
# APPLE_APP_PASSWORD, APPLE_TEAM_ID, IOS_CERTIFICATE_BASE64/PASSWORD,
# IOS_PROFILE_BASE64 AND IOS_WIDGETS_PROFILE_BASE64 (both profiles required).
# Unsigned iOS IPAs are compile artifacts, not device-installable releases.

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: TestFlight distribution (none builds all platforms without publishing)
        type: choice
        default: none
        options: [none, internal, public]
      testflight_sha:
        description: Commit for the TestFlight build (defaults to the selected branch)
        type: string
        required: false
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md', 'docs/**']

permissions:
  contents: read

concurrency:
  group: ${{ inputs.testflight && inputs.testflight != 'none' && 'package-testflight' || format('package-{0}', github.ref) }}
  cancel-in-progress: ${{ inputs.testflight == '' || inputs.testflight == 'none' }}

jobs:
  macos:
    name: macOS DMG
    if: inputs.testflight == '' || inputs.testflight == 'none'
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Resolve pinned NSGo
        run: |
          mkdir -p build/.tmp
          scripts/ci-pin-nsgo.sh
      - name: Set the version from the tag
        if: github.ref_type == 'tag'
        run: python3 scripts/ci-config.py --version "$GITHUB_REF_NAME" --build-number "$GITHUB_RUN_NUMBER"
      - name: Import the Developer ID identity
        if: env.MACOS_CERTIFICATE_BASE64 != ''
        run: |
          umask 077
          dir="$RUNNER_TEMP/macos-signing"; mkdir -p "$dir"
          kc="$dir/signing.keychain-db"; pw=$(openssl rand -hex 32)
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$dir/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 7200 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security import "$dir/cert.p12" -k "$kc" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" > /dev/null
          rm -f "$dir/cert.p12"
          identity=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)
          if [ -z "$identity" ]; then echo 'No Developer ID Application identity in the certificate' >&2; exit 1; fi
          echo "MIYA_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            security default-keychain -d user -s "$kc"
            xcrun notarytool store-credentials miya-notary --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --keychain "$kc"
            python3 scripts/ci-config.py --notarize miya-notary
            echo "MACOS_NOTARIZE=1" >> "$GITHUB_ENV"
          fi
      - name: Build the app and disk image
        env:
          MIYA_UPDATE_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}
        run: |
          flags=()
          if [ "${MACOS_NOTARIZE:-}" = 1 ]; then flags+=(-release); fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            export NSGO_UPDATES_KEY
            NSGO_UPDATES_KEY=$(python3 scripts/nsgo-update-key.py)
            flags+=(-channel direct)
          fi
          ./scripts/build-macos.sh -target macos_universal -installers "${flags[@]}"
          app=$(find build -maxdepth 2 -path '*macos_universal/Miya.app' -print -quit)
          dmg=$(find build/releases -name '*.dmg' -print -quit)
          test -n "$app" && test -n "$dmg"
          codesign --verify --deep --strict "$app"
          python3 scripts/verify-package.py "$app"
          archs=$(lipo -archs "$app/Contents/MacOS/Miya")
          [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]]
          shasum -a 256 "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test -s build/releases/appcast-macos_universal.xml; fi
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: miya-native-updates-macos
          path: build/releases/appcast-macos_universal.xml
          if-no-files-found: error
      - name: Package remote desktop updates
        if: github.ref_type == 'tag'
        run: |
          app=$(find build -maxdepth 2 -path '*macos_universal/Miya.app' -print -quit)
          version=${GITHUB_REF_NAME#v}
          for arch in arm64 amd64; do
            python3 scripts/package-update.py --source "$app" --target "darwin-$arch" --version "$version" --out "build/updates"
          done
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: miya-desktop-updates
          path: build/updates/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: miya-macos
          path: ${{ env.DMG }}
          if-no-files-found: error
          retention-days: 30
      - name: Remove the signing keychain
        if: always() && env.MACOS_KEYCHAIN != ''
        run: |
          security delete-keychain "$MACOS_KEYCHAIN" || true
          rm -rf "$RUNNER_TEMP/macos-signing"

  windows:
    name: Windows installer
    if: inputs.testflight == '' || inputs.testflight == 'none'
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Resolve pinned NSGo
        shell: bash
        run: scripts/ci-pin-nsgo.sh
      - name: Set the version from the tag
        if: github.ref_type == 'tag'
        run: python scripts/ci-config.py --version "$env:GITHUB_REF_NAME" --build-number "$env:GITHUB_RUN_NUMBER"
      - name: Build installer
        env:
          MIYA_UPDATE_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}
        shell: bash
        run: |
          flags=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            export NSGO_UPDATES_KEY
            NSGO_UPDATES_KEY=$(python3 scripts/nsgo-update-key.py)
            flags+=(-channel direct)
          fi
          go tool nsgo build -target windows_${{ matrix.arch }} -installers "${flags[@]}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test -s build/releases/appcast-windows_${{ matrix.arch }}.xml; fi
      - uses: actions/upload-artifact@v4
        with:
          name: miya-windows-${{ matrix.arch }}
          path: |
            build/releases/*.exe
            build/releases/appcast-windows_${{ matrix.arch }}.xml
          if-no-files-found: error

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.testflight_version.outputs.version }}
    defaults:
      run:
        shell: bash
    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      IOS_WIDGETS_PROFILE_BASE64: ${{ secrets.IOS_WIDGETS_PROFILE_BASE64 }}
      IOS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.testflight != 'none' && inputs.testflight_sha || github.sha }}
          fetch-tags: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Resolve pinned NSGo
        run: |
          mkdir -p build/.tmp
          scripts/ci-pin-nsgo.sh
      - name: Set the version from the tag
        if: github.ref_type == 'tag'
        run: python3 scripts/ci-config.py --version "$GITHUB_REF_NAME"
      - name: Prepare the TestFlight build
        if: inputs.testflight != '' && inputs.testflight != 'none'
        env:
          TESTFLIGHT_SHA: ${{ inputs.testflight_sha }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'TestFlight publishing requires the main branch.' >&2
            exit 1
          fi
          if [ -n "$TESTFLIGHT_SHA" ]; then
            version=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -1)
            if [ -n "$version" ]; then python3 scripts/ci-config.py --version "$version"; fi
          fi
          version=$(python3 -c 'import json; print(json.load(open("nsgo.yaml"))["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
        id: testflight_version
      - name: Check the iOS tools
        run: go tool nsgo doctor
      - name: Import the distribution identity and profile
        if: env.IOS_CERTIFICATE_BASE64 != '' && env.IOS_PROFILE_BASE64 != '' && env.IOS_WIDGETS_PROFILE_BASE64 != ''
        run: |
          umask 077
          dir="$RUNNER_TEMP/ios-signing"; mkdir -p "$dir"
          kc="$dir/signing.keychain-db"; pw=$(openssl rand -hex 32)
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$dir/cert.p12"
          printf '%s' "$IOS_PROFILE_BASE64" | base64 --decode > "$dir/profile.mobileprovision"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 7200 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security import "$dir/cert.p12" -k "$kc" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" > /dev/null
          rm -f "$dir/cert.p12"
          printf '%s' "$IOS_WIDGETS_PROFILE_BASE64" | base64 --decode > "$dir/widgets.mobileprovision"
          security cms -D -i "$dir/profile.mobileprovision" > "$dir/profile.plist"
          team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$dir/profile.plist")
          appid=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$dir/profile.plist")
          case "$appid" in *.com.daodao.miya) ;; *) echo "Profile is for $appid, not com.daodao.miya" >&2; exit 1 ;; esac
          python3 scripts/ci-config.py --ios-signing "$team" "$dir/profile.mobileprovision" "$dir/widgets.mobileprovision"
          echo "IOS_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          echo "IOS_SIGNED=1" >> "$GITHUB_ENV"
      - name: Build the IPA
        env:
          TESTFLIGHT_TARGET: ${{ inputs.testflight }}
        run: |
          if [[ -n "$TESTFLIGHT_TARGET" && "$TESTFLIGHT_TARGET" != none && "${IOS_SIGNED:-}" != 1 ]]; then
            echo 'TestFlight requires the app and widget signing profiles.' >&2
            exit 1
          fi
          python3 scripts/ci-config.py --build-number "$IOS_BUILD_NUMBER"
          if [ "${IOS_SIGNED:-}" != 1 ]; then python3 scripts/ci-config.py --unsigned-ios; fi
          ./scripts/build-ios.sh
          ipa=$(find build/releases -name '*-ios.ipa' -print -quit)
          test -n "$ipa"
          flags=()
          if [ "${IOS_SIGNED:-}" = 1 ]; then flags=(--signed); fi
          python3 scripts/verify-package.py "$ipa" "${flags[@]}"
          mkdir -p build/ios-artifact
          if [ "${IOS_SIGNED:-}" = 1 ]; then
            cp "$ipa" build/ios-artifact/Miya.ipa
          else
            cp "$ipa" build/ios-artifact/Miya-ios-unsigned.ipa
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: miya-ios
          path: build/ios-artifact/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove the signing material
        if: always() && env.IOS_KEYCHAIN != ''
        run: |
          security delete-keychain "$IOS_KEYCHAIN" || true
          rm -rf "$RUNNER_TEMP/ios-signing"

  testflight:
    name: Publish to TestFlight
    if: github.ref == 'refs/heads/main' && inputs.testflight != '' && inputs.testflight != 'none'
    needs: ios
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: testflight
    concurrency:
      group: miya-testflight-${{ inputs.testflight }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: miya-ios
          path: ipa
      - name: Install App Store Connect CLI
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rorkai/App-Store-Connect-CLI/releases/download/7.6.0/asc_7.6.0_linux_amd64 \
            --output "$RUNNER_TEMP/asc"
          echo "7ab1cc1718aaed429e49587d88be2cac939ba9a19e122bd412c8e6c09060fbf5  $RUNNER_TEMP/asc" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/asc"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Upload and distribute the signed IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          TESTFLIGHT_TARGET: ${{ inputs.testflight }}
          TESTFLIGHT_VERSION: ${{ needs.ios.outputs.version }}
        run: |
          umask 077
          : "${ASC_KEY_ID:?Missing ASC_KEY_ID}" "${ASC_ISSUER_ID:?Missing ASC_ISSUER_ID}" "${ASC_PRIVATE_KEY:?Missing ASC_PRIVATE_KEY}"
          ASC_PRIVATE_KEY_PATH=$(mktemp)
          export ASC_PRIVATE_KEY_PATH
          trap 'rm -f "$ASC_PRIVATE_KEY_PATH"' EXIT
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$ASC_PRIVATE_KEY_PATH"
          unset ASC_PRIVATE_KEY
          export TESTFLIGHT_UPDATE_RECORD="$RUNNER_TEMP/update-ios.json"
          bash scripts/publish-testflight.sh "$TESTFLIGHT_TARGET" "$TESTFLIGHT_VERSION" "$GITHUB_RUN_NUMBER" ipa/*.ipa
      - name: Publish available public iOS version
        if: inputs.testflight == 'public'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-testflight-update.sh "$RUNNER_TEMP/update-ios.json"

  android:
    name: Android APK
    if: inputs.testflight == '' || inputs.testflight == 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Resolve pinned NSGo
        run: |
          mkdir -p build/.tmp
          scripts/ci-pin-nsgo.sh
      - name: Set the version from the tag
        if: github.ref_type == 'tag'
        run: python3 scripts/ci-config.py --version "$GITHUB_REF_NAME" --android-version-code
      - name: Build the APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ github.ref_type == 'tag' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          NSGO_KEYSTORE_PASSWORD: ${{ github.ref_type == 'tag' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
        run: |
          flags=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            : "${ANDROID_KEYSTORE_BASE64:?Missing Android release keystore}"
            : "${NSGO_KEYSTORE_PASSWORD:?Missing Android release key password}"
            umask 077
            key="$RUNNER_TEMP/miya-android.p12"
            trap 'rm -f "$key"' EXIT
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key"
            unset ANDROID_KEYSTORE_BASE64
            flags+=(-keystore "$key" -key-alias miya)
          fi
          ./scripts/build-android.sh "${flags[@]}"
          python3 scripts/verify-package.py build/releases/*-android-arm64.apk
          sha256sum build/releases/*-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: miya-android
          path: build/releases/*-android-arm64.apk
          if-no-files-found: error
          retention-days: 30

  server:
    if: inputs.testflight == '' || inputs.testflight == 'none'
    name: Linux server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Resolve pinned NSGo
        run: |
          mkdir -p build/.tmp
          scripts/ci-pin-nsgo.sh
      - name: Set the version from the tag
        if: github.ref_type == 'tag'
        run: python3 scripts/ci-config.py --version "$GITHUB_REF_NAME"
      - name: Build server
        run: ./scripts/build-server.sh "${{ matrix.arch }}"
      - name: Package remote server update
        if: github.ref_type == 'tag'
        run: python3 scripts/package-update.py --source "build/server/linux-${{ matrix.arch }}/miya" --target "linux-${{ matrix.arch }}" --version "${GITHUB_REF_NAME#v}" --out build/updates
      - uses: actions/upload-artifact@v4
        with:
          name: miya-server-${{ matrix.arch }}
          path: |
            build/server/*.tar.gz
            build/updates/*
          if-no-files-found: error

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: [macos, windows, ios, android, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create a draft release with the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/package-update.py --merge artifacts --out artifacts
          ls -la artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "Miya $GITHUB_REF_NAME"
