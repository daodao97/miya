name: Package

# Packages Miya for macOS, Windows, Linux desktop, iOS, Android and Linux server.
# go.mod pins the daodao97/mygo fork (replace github.com/egoist/mygo => a
# pseudo-version), so the jobs need only this repository; a local go.work
# that points at ../mygo is for development and is not committed.
#
# Signing is optional. Without secrets the jobs still produce artifacts:
#   macOS   unsigned DMG with an ad hoc signed app
#   Windows unsigned NSIS installer
#   iOS     simulator build (no provisioning profile needed)
#   Android debug-signed APK
#
# Secrets (all optional):
#   MACOS_CERTIFICATE_BASE64, MACOS_CERTIFICATE_PASSWORD   Developer ID Application .p12
#   APPLE_ID, APPLE_APP_PASSWORD, APPLE_TEAM_ID            notarization (needs the certificate)
#   IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD       Apple Distribution .p12
#   IOS_PROFILE_BASE64                                     provisioning profile for com.daodao.miya
#   MYGO_UPDATER_PRIVATE_KEY                               required for tagged desktop updates
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD     required for tagged Android APKs

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: TestFlight distribution (none builds all platforms without publishing)
        type: choice
        default: none
        options: [none, internal, public]
      testflight_sha:
        description: Commit for the TestFlight build (defaults to the selected branch)
        type: string
        required: false
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md', 'docs/**']

permissions:
  contents: read

concurrency:
  group: ${{ inputs.testflight && inputs.testflight != 'none' && 'package-testflight' || format('package-{0}', github.ref) }}
  cancel-in-progress: ${{ inputs.testflight == '' || inputs.testflight == 'none' }}

env:
  ANDROID_NDK_VERSION: 28.2.13676358
  CGO_ENABLED: '0'
  TESTFLIGHT_VERSION: '0.1.0'

jobs:
  macos:
    name: macOS DMG
    if: inputs.testflight == '' || inputs.testflight == 'none'
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Set the version from the tag
        if: github.ref_type == 'tag'
        run: python3 scripts/ci-config.py --version "$GITHUB_REF_NAME"
      - name: Import the Developer ID identity
        if: env.MACOS_CERTIFICATE_BASE64 != ''
        run: |
          umask 077
          dir="$RUNNER_TEMP/macos-signing"; mkdir -p "$dir"
          kc="$dir/signing.keychain-db"; pw=$(openssl rand -hex 32)
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$dir/cert.p12"
          security create-keychain -p "$pw" "$kc"
          echo "MACOS_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 7200 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security import "$dir/cert.p12" -k "$kc" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" > /dev/null
          rm -f "$dir/cert.p12"
          identity=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)
          if [ -z "$identity" ]; then echo 'No Developer ID Application identity in the certificate' >&2; exit 1; fi
          echo "MIYA_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            xcrun notarytool store-credentials miya-notary --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --keychain "$kc"
            python3 scripts/ci-config.py --notarize miya-notary "$kc"
          fi
      - name: Build the app and disk image
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            : "${MYGO_UPDATER_PRIVATE_KEY:?Missing MyGo updater signing key}"
          fi
          out="$RUNNER_TEMP/dist"
          ./scripts/package-macos.sh -o "$out"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test -s "$out/darwin-universal/miya-${GITHUB_REF_NAME#v}-darwin-universal.tar.gz"
            test -s "$out/darwin-universal/update-darwin-universal.json"
            # Existing updater binaries request the feed for their architecture.
            # Both feeds can point to the same signed universal archive.
            for arch in arm64 amd64; do
              cp "$out/darwin-universal/update-darwin-universal.json" "$out/darwin-universal/update-darwin-$arch.json"
            done
          fi
          dmg=$(find "$out" -name '*.dmg' -print -quit)
          if [ -z "$dmg" ]; then echo 'mygo build produced no disk image' >&2; exit 1; fi
          codesign --verify --deep --strict "$(find "$out" -maxdepth 2 -name '*.app' -print -quit)"
          if [ -n "${MIYA_SIGNING_IDENTITY:-}" ]; then
            codesign --verify --strict "$dmg"
          fi
          shasum -a 256 "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"
      - name: Package remote desktop updates
        if: github.ref_type == 'tag'
        run: |
          app=$(find "$RUNNER_TEMP/dist" -maxdepth 2 -name '*.app' -print -quit)
          version=${GITHUB_REF_NAME#v}
          for arch in arm64 amd64; do
            python3 scripts/package-update.py --source "$app" --target "darwin-$arch" --version "$version" --out "$RUNNER_TEMP/updates"
          done
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: miya-desktop-updates
          path: ${{ runner.temp }}/updates/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: miya-native-updates-macos
          path: |
            ${{ runner.temp }}/dist/darwin-universal/miya-*-darwin-universal.tar.gz
            ${{ runner.temp }}/dist/darwin-universal/update-darwin-*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: miya-macos
          path: ${{ env.DMG }}
          if-no-files-found: error
          retention-days: 30
      - name: Remove the signing keychain
        if: always() && env.MACOS_KEYCHAIN != ''
        run: |
          security delete-keychain "$MACOS_KEYCHAIN" || true
          rm -rf "$RUNNER_TEMP/macos-signing"

  windows:
    name: Windows installer
    if: inputs.testflight == '' || inputs.testflight == 'none'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Set the version from the tag
        if: github.ref_type == 'tag'
        run: python scripts/ci-config.py --version "$env:GITHUB_REF_NAME"
      - name: Build the NSIS installer
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag" -and -not $env:MYGO_UPDATER_PRIVATE_KEY) {
            throw "Missing MyGo updater signing key"
          }
          go tool mygo build -platform windows/${{ matrix.arch }} -o build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $target = "windows-${{ matrix.arch }}"
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            if (!(Test-Path "build/$target/miya-$version-$target.tar.gz") -or !(Test-Path "build/$target/update-$target.json")) {
              throw "Missing MyGo updater archive or manifest"
            }
          }
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: miya-native-updates-windows-${{ matrix.arch }}
          path: |
            build/windows-${{ matrix.arch }}/miya-*-windows-${{ matrix.arch }}.tar.gz
            build/windows-${{ matrix.arch }}/update-windows-${{ matrix.arch }}.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: miya-windows-${{ matrix.arch }}
          path: build/windows-${{ matrix.arch }}/miya-setup-*.exe
          if-no-files-found: error
          retention-days: 30

  linux-desktop:
    name: Linux desktop packages
    if: inputs.testflight == '' || inputs.testflight == 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Set the version from the tag
        if: github.ref_type == 'tag'
        run: python3 scripts/ci-config.py --version "$GITHUB_REF_NAME"
      - name: Build the DEB and RPM packages
        run: go tool mygo build -platform linux/${{ matrix.arch }} -o build
      - name: Collect the desktop packages
        run: |
          mkdir -p "$RUNNER_TEMP/linux-desktop"
          cp build/linux-${{ matrix.arch }}/*.{deb,rpm} "$RUNNER_TEMP/linux-desktop/"
      - uses: actions/upload-artifact@v4
        with:
          name: miya-linux-desktop-${{ matrix.arch }}
          path: ${{ runner.temp }}/linux-desktop/*
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      IOS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.testflight != 'none' && inputs.testflight_sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Set the version from the tag
        if: github.ref_type == 'tag'
        run: python3 scripts/ci-config.py --version "$GITHUB_REF_NAME"
      - name: Set the TestFlight version
        if: inputs.testflight != '' && inputs.testflight != 'none'
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'TestFlight publishing requires the main branch.' >&2
            exit 1
          fi
          python3 scripts/ci-config.py --version "$TESTFLIGHT_VERSION"
      - name: Check the iOS tools
        run: xcodebuild -showsdks
      - name: Import the distribution identity and profile
        if: env.IOS_CERTIFICATE_BASE64 != '' && env.IOS_PROFILE_BASE64 != ''
        run: |
          umask 077
          dir="$RUNNER_TEMP/ios-signing"; mkdir -p "$dir"
          kc="$dir/signing.keychain-db"; pw=$(openssl rand -hex 32)
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$dir/cert.p12"
          printf '%s' "$IOS_PROFILE_BASE64" | base64 --decode > "$dir/profile.mobileprovision"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 7200 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security import "$dir/cert.p12" -k "$kc" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" > /dev/null
          rm -f "$dir/cert.p12"
          security cms -D -i "$dir/profile.mobileprovision" > "$dir/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$dir/profile.plist")
          team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$dir/profile.plist")
          appid=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$dir/profile.plist")
          case "$appid" in *.com.daodao.miya) ;; *) echo "Profile is for $appid, not com.daodao.miya" >&2; exit 1 ;; esac
          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles"
          cp "$dir/profile.mobileprovision" "$profiles/$uuid.mobileprovision"
          python3 scripts/ci-config.py --ios-signing "$team" "$uuid" --ios-build-number "$IOS_BUILD_NUMBER"
          echo "IOS_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_PATH=$profiles/$uuid.mobileprovision" >> "$GITHUB_ENV"
          echo "IOS_SIGNED=1" >> "$GITHUB_ENV"
      - name: Build the signed IPA
        if: env.IOS_SIGNED == '1'
        run: |
          ./scripts/build-ios.sh
          mkdir -p "$RUNNER_TEMP/ios-artifact"
          cp build/ios-arm64/*.ipa "$RUNNER_TEMP/ios-artifact/"
      - name: Build the simulator app
        if: env.IOS_SIGNED != '1'
        run: |
          python3 scripts/ci-config.py --ios-build-number "$IOS_BUILD_NUMBER"
          MIYA_IOS_PLATFORM=ios/simulator ./scripts/build-ios.sh
          mkdir -p "$RUNNER_TEMP/ios-artifact"
          ditto -c -k --keepParent build/ios-simulator/Miya.app "$RUNNER_TEMP/ios-artifact/Miya-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: miya-ios
          path: ${{ runner.temp }}/ios-artifact/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove the signing material
        if: always() && env.IOS_KEYCHAIN != ''
        run: |
          security delete-keychain "$IOS_KEYCHAIN" || true
          rm -f "$IOS_PROFILE_PATH"
          rm -rf "$RUNNER_TEMP/ios-signing"

  testflight:
    name: Publish to TestFlight
    if: github.ref == 'refs/heads/main' && inputs.testflight != '' && inputs.testflight != 'none'
    needs: ios
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: testflight
    concurrency:
      group: miya-testflight-${{ inputs.testflight }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: miya-ios
          path: ipa
      - name: Install App Store Connect CLI
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rorkai/App-Store-Connect-CLI/releases/download/7.6.0/asc_7.6.0_linux_amd64 \
            --output "$RUNNER_TEMP/asc"
          echo "7ab1cc1718aaed429e49587d88be2cac939ba9a19e122bd412c8e6c09060fbf5  $RUNNER_TEMP/asc" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/asc"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Upload and distribute the signed IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          TESTFLIGHT_TARGET: ${{ inputs.testflight }}
        run: |
          umask 077
          : "${ASC_KEY_ID:?Missing ASC_KEY_ID}" "${ASC_ISSUER_ID:?Missing ASC_ISSUER_ID}" "${ASC_PRIVATE_KEY:?Missing ASC_PRIVATE_KEY}"
          ASC_PRIVATE_KEY_PATH=$(mktemp)
          export ASC_PRIVATE_KEY_PATH
          trap 'rm -f "$ASC_PRIVATE_KEY_PATH"' EXIT
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$ASC_PRIVATE_KEY_PATH"
          unset ASC_PRIVATE_KEY
          export TESTFLIGHT_UPDATE_RECORD="$RUNNER_TEMP/update-ios.json"
          bash scripts/publish-testflight.sh "$TESTFLIGHT_TARGET" "$TESTFLIGHT_VERSION" "$GITHUB_RUN_NUMBER" ipa/*.ipa
      - name: Publish available public iOS version
        if: inputs.testflight == 'public'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-testflight-update.sh "$RUNNER_TEMP/update-ios.json"

  android:
    name: Android APK
    if: inputs.testflight == '' || inputs.testflight == 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set the version from the tag
        if: github.ref_type == 'tag'
        run: python3 scripts/ci-config.py --version "$GITHUB_REF_NAME"
      - name: Install the NDK
        run: |
          # yes dies of SIGPIPE once sdkmanager stops reading; pipefail would fail the step.
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null
      # The same prebuilt HarfBuzz/FreeType that MyGo's Android workflow uses.
      - name: Download HarfBuzz and FreeType for Android
        run: |
          mkdir -p "$RUNNER_TEMP/hb"
          curl -fsSL https://github.com/Heyana/mygo-upstream/releases/download/hb-android-arm64/hb-android-arm64.tar.gz \
            | tar xz -C "$RUNNER_TEMP/hb"
          echo "MYGO_HB_ANDROID=$RUNNER_TEMP/hb/android" >> "$GITHUB_ENV"
      - name: Build the APK
        env:
          CGO_ENABLED: '1'
          ANDROID_KEYSTORE_BASE64: ${{ github.ref_type == 'tag' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          MYGO_ANDROID_KEYSTORE_PASSWORD: ${{ github.ref_type == 'tag' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            : "${ANDROID_KEYSTORE_BASE64:?Missing Android release keystore}"
            : "${MYGO_ANDROID_KEYSTORE_PASSWORD:?Missing Android release key password}"
            umask 077
            export MIYA_ANDROID_KEYSTORE="$RUNNER_TEMP/miya-android.p12"
            trap 'rm -f "$MIYA_ANDROID_KEYSTORE"' EXIT
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$MIYA_ANDROID_KEYSTORE"
            unset ANDROID_KEYSTORE_BASE64
          fi
          ./scripts/build-android.sh
          sha256sum build/android/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: miya-android
          path: build/android/*.apk
          if-no-files-found: error
          retention-days: 30

  server:
    name: Linux server
    if: inputs.testflight == '' || inputs.testflight == 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Set the version from the tag
        if: github.ref_type == 'tag'
        run: python3 scripts/ci-config.py --version "$GITHUB_REF_NAME"
      - name: Build server
        run: ./scripts/build-server.sh "${{ matrix.arch }}" "$RUNNER_TEMP/server/linux-${{ matrix.arch }}"
      - name: Package remote server update
        if: github.ref_type == 'tag'
        run: python3 scripts/package-update.py --source "$RUNNER_TEMP/server/linux-${{ matrix.arch }}/miya" --target "linux-${{ matrix.arch }}" --version "${GITHUB_REF_NAME#v}" --out "$RUNNER_TEMP/server"
      - uses: actions/upload-artifact@v4
        with:
          name: miya-server-${{ matrix.arch }}
          # Use a shared artifact root so the release job can merge the manifests.
          path: |
            ${{ runner.temp }}/server/*.tar.gz
            ${{ runner.temp }}/server/miya-update-*.json
          if-no-files-found: error
          retention-days: 30

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: [macos, windows, linux-desktop, ios, android, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create a draft release with the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/package-update.py --merge artifacts --out artifacts
          ls -la artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "Miya $GITHUB_REF_NAME"
